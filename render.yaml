# Render Blueprint — the Moracat API (NestJS, Docker).
# In Render: New → Blueprint → connect this repo. Render reads this file.
# You still create the database on Neon (free) and paste DATABASE_URL below.
services:
  - type: web
    name: moracat-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # ── Community Mode: monetization disabled (fail-closed) ──────────────
      # No checkout, no paid subscriptions, no payment surface is reachable.
      # Flip to true ONLY when payments go live (and set PAYMENTS_MODE=live —
      # the API refuses to boot if commerce is on while the PSP is mock).
      - key: COMMERCE_ENABLED
        value: false
      - key: PAYMENTS_MODE
        value: mock
      # ── Transactional email (Resend) ────────────────────────────────────
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: Moracat <noreply@moracat.co>
      # Resend API key — paste in the Render dashboard (kept secret).
      - key: RESEND_API_KEY
        sync: false
      # ── Object storage (Cloudflare R2, S3-compatible) ───────────────────
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: moracat-media
      # Endpoint https://<account>.r2.cloudflarestorage.com + keys + public URL
      # are secrets — paste in the Render dashboard.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Public bucket URL is not a secret — set it directly.
      - key: S3_PUBLIC_URL
        value: https://pub-1bc6cdbbb878439f908a3257ecaa6a11.r2.dev
      # Neon connection string — paste in the Render dashboard (kept secret).
      # IMPORTANT: use the POOLED Neon URL (host contains "-pooler") with
      # ?sslmode=require&pgbouncer=true&connection_limit=1 — the direct URL will
      # exhaust Neon's connection cap under load.
      - key: DATABASE_URL
        sync: false
      # The DIRECT (non-pooled) Neon URL — host has NO "-pooler". Used ONLY by
      # `prisma migrate deploy` at container start (start.sh); Prisma cannot run
      # migrations through pgbouncer. A failed migration now aborts boot, so this
      # must be set in production. Falls back to DATABASE_URL if unset.
      - key: DIRECT_DATABASE_URL
        sync: false
      # ── Observability (Sentry + logs) ───────────────────────────────────
      # Paste the API DSN in the dashboard; empty = disabled (no-op).
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: info
      # Seed admin: created ONLY when this is set (prod is skipped otherwise);
      # must be ≥12 chars. Leave unset unless bootstrapping the first admin.
      - key: ADMIN_SEED_PASSWORD
        sync: false
      # Auto-generated strong secrets (Render fills these once).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # CORS: the web origin allowed to call this API.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://moracat.co
      # Extra allowed origins (comma-separated) — the live Vercel URL.
      - key: CORS_ORIGINS
        value: https://moracat.vercel.app
      # SMS OTP via Twilio — set these in the Render dashboard (kept secret).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Optional integrations — set when ready.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
