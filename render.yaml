# Render Blueprint — the Moracat API (NestJS, Docker).
# In Render: New → Blueprint → connect this repo. Render reads this file.
# You still create the database on Neon (free) and paste DATABASE_URL below.
services:
  - type: web
    name: moracat-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENTS_MODE
        value: mock
      # Neon connection string — paste in the Render dashboard (kept secret).
      - key: DATABASE_URL
        sync: false
      # Auto-generated strong secrets (Render fills these once).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # CORS: the web origin allowed to call this API.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://moracat.co
      # SMS OTP via Twilio — set these in the Render dashboard (kept secret).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Optional integrations — set when ready.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
