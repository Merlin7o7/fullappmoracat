# Production-shaped stack: postgres + api + web.
#   docker compose -f docker-compose.prod.yml up --build
# Set real secrets via environment or an .env file next to this compose file.
# (No Redis: the app doesn't use it in Community Mode — the throttler is
# in-memory. Add it back here only when a Redis-backed throttle/cache is wired.)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moraqat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-moraqat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moraqat} -d ${POSTGRES_DB:-moraqat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moraqat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-moraqat}?schema=public
      API_PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-mock}
      MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-}
      MOYASAR_WEBHOOK_SECRET: ${MOYASAR_WEBHOOK_SECRET:-}
      TABBY_API_KEY: ${TABBY_API_KEY:-}
      TABBY_WEBHOOK_SECRET: ${TABBY_WEBHOOK_SECRET:-}
      TAMARA_API_TOKEN: ${TAMARA_API_TOKEN:-}
      TAMARA_NOTIFICATION_TOKEN: ${TAMARA_NOTIFICATION_TOKEN:-}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
