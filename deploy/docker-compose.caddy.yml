# Overlay that fronts the prod stack with Caddy (automatic HTTPS on your domain).
# Use TOGETHER with the base prod compose:
#
#   docker compose -f docker-compose.prod.yml -f deploy/docker-compose.caddy.yml up -d --build
#
# Requires SITE_DOMAIN + API_DOMAIN in your .env (see .env.production.example).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
