services:
  postgres:
    image: postgres:16-alpine
    container_name: moraqat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moraqat
      POSTGRES_PASSWORD: moraqat_dev_pw
      POSTGRES_DB: moraqat
    ports:
      - "5432:5432"
    volumes:
      - moraqat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moraqat -d moraqat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: moraqat_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - moraqat_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  moraqat_pgdata:
  moraqat_redisdata:
