name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # prisma generate needs a syntactically valid URL even when no DB is used.
  DATABASE_URL: postgresql://moraqat:moraqat@localhost:5432/moraqat?schema=public

jobs:
  quality:
    name: Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages (generates Prisma client)
        run: pnpm --filter @moraqat/db build && pnpm --filter @moraqat/core build

      - name: Typecheck
        run: pnpm --filter @moraqat/api typecheck && pnpm --filter @moraqat/web typecheck && pnpm --filter @moraqat/ui typecheck && pnpm --filter @moraqat/core typecheck

      - name: Lint (web)
        run: pnpm --filter @moraqat/web lint

      - name: Unit tests
        run: pnpm --filter @moraqat/core test && pnpm --filter @moraqat/api test

      - name: Dependency audit (high+)
        run: pnpm audit --audit-level=high --prod
        continue-on-error: true

      - name: Build API
        run: pnpm --filter @moraqat/api build

      - name: Build Web (standalone — validates the Docker output mode)
        run: pnpm --filter @moraqat/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_STANDALONE: 1

  e2e:
    name: API E2E smoke (live Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moraqat
          POSTGRES_PASSWORD: moraqat
          POSTGRES_DB: moraqat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moraqat -d moraqat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build db + core + api
        run: pnpm --filter @moraqat/db build && pnpm --filter @moraqat/core build && pnpm --filter @moraqat/api build

      - name: Apply migrations + seed (validates committed migrations)
        run: pnpm --filter @moraqat/db migrate:deploy && pnpm --filter @moraqat/db seed

      - name: Run smoke suite
        run: node apps/api/e2e/run.mjs

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    # Image builds are the slowest job — only gate main.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
